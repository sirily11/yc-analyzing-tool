name: Update YC batch growth

on:
  schedule:
    # 02:30 UTC — the yc-oss mirror publishes around 01:00 UTC, and GitHub routinely delays
    # scheduled runs by 5-30 minutes. A missed day is harmless: the script derives the dates it
    # is missing from observedRanges and backfills them on the next run.
    - cron: "30 2 * * *"
  workflow_dispatch:
    inputs:
      backfill:
        description: Walk the full meta.json commit history instead of the incremental window
        type: boolean
        default: false

concurrency:
  group: yc-batch-growth
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.9"

      # No `bun install`: the script and lib/yc/batch-growth.ts use only builtins and fetch,
      # and it needs no Turso, AI gateway, or other secret.
      - name: Update batch growth data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun run scripts/update-batch-growth.ts ${{ inputs.backfill && '--backfill' || '' }}

      - name: Create pull request when the data changed
        id: create-pull-request
        uses: peter-evans/create-pull-request@v8
        with:
          branch: automation/yc-batch-growth
          base: main
          delete-branch: true
          add-paths: data/**
          commit-message: "chore(data): refresh YC batch growth"
          title: "chore(data): refresh YC batch growth"
          body: |
            Automated refresh of the committed YC batch-growth timeseries.

            Generated by the scheduled `Update YC batch growth` workflow.

      - name: Enable auto-merge
        if: steps.create-pull-request.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          gh pr merge
          --repo "${{ github.repository }}"
          --auto
          --squash
          "${{ steps.create-pull-request.outputs.pull-request-number }}"
