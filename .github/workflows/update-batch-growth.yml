name: Update YC batch growth

on:
  schedule:
    # 02:30 UTC — the yc-oss mirror publishes around 01:00 UTC, and GitHub routinely delays
    # scheduled runs by 5-30 minutes. A missed day is harmless: the script derives the dates it
    # is missing from observedRanges and backfills them on the next run.
    - cron: "30 2 * * *"
  workflow_dispatch:
    inputs:
      backfill:
        description: Walk the full meta.json commit history instead of the incremental window
        type: boolean
        default: false

concurrency:
  group: yc-batch-growth
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.9"

      # No `bun install`: the script and lib/yc/batch-growth.ts use only builtins and fetch,
      # and it needs no Turso, AI gateway, or other secret.
      - name: Update batch growth data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun run scripts/update-batch-growth.ts ${{ inputs.backfill && '--backfill' || '' }}

      - name: Commit when the data changed
        run: |
          # Stage first: `git diff --quiet -- data` ignores untracked files, so a newly added
          # data file would otherwise look like "no changes" and never get committed.
          git add -A data
          if git diff --cached --quiet; then
            echo "No YC batch growth changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(data): refresh YC batch growth $(date -u +%F)"
          git pull --rebase --autostash
          git push
